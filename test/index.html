<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>InstaDenetim test</title></head>
<body style="margin:0;font-family:sans-serif">
<div style="padding:40px">Sahte Instagram sayfası (panel gizliyken görünür). Gerçek Instagram'a hiçbir istek gitmez.</div>
<script>
// ---- Sahte Instagram API'si (test/serve.sh ile sunulur; adres parametreleri test/serve.sh'de) ----
const P = new URLSearchParams(location.search);
window.SPEED = parseFloat(P.get("speed") || "0.01");
const _st = window.setTimeout.bind(window);
window.setTimeout = (f, ms, ...a) => _st(f, (ms || 0) * window.SPEED, ...a);
if (P.get("fresh") === "1") {
  localStorage.clear(); sessionStorage.clear();
  indexedDB.deleteDatabase("igd");
}
if (P.get("login") !== "0") { document.cookie = "ds_user_id=42; path=/"; document.cookie = "csrftoken=abc; path=/"; }
else { document.cookie = "ds_user_id=; Max-Age=0; path=/"; }

const mk = (i, extra) => Object.assign({ pk: String(1000 + i), username: "kullanici_" + i, full_name: "Test Kişi " + i, profile_pic_url: "", is_verified: i % 7 === 0, is_private: i % 3 === 0 }, extra || {});
const NF = parseInt(P.get("nf") || "300", 10);
const FOLLOWING = Array.from({ length: 120 }, (_, i) => mk(i));
const FOLLOWERS = [...FOLLOWING.slice(0, 50), ...Array.from({ length: NF }, (_, i) => mk(5000 + i, i % 9 === 0 ? { username: "xk" + (90000 + i) + "qz", full_name: "", has_anonymous_profile_picture: true } : {}))];
const SERVED_FOLLOWERS = P.get("trunc") === "1" ? FOLLOWERS.slice(0, Math.floor(FOLLOWERS.length * 0.4)) : FOLLOWERS;
const THREADS = Array.from({ length: 45 }, (_, i) => ({ thread_id: "t" + i, users: [{ pk: 1000 + i, username: "kullanici_" + i, profile_pic_url: "" }], last_activity_at: (Date.now() - i * 9 * 86400000) * 1000 }));
const POSTS = Array.from({ length: 12 }, (_, i) => ({ pk: String(777000 + i), id: `${777000 + i}_42`, like_count: 40 }));
// Hikayeler: kimlikler 2^53'ten büyük (sayı olarak okunursa bozulur). Her izleyici isteğinde biri yeni bakar, biri tekrar bakar.
const NOW_S = Math.floor(Date.now() / 1000);
const STORIES = [{ id: "3480000000000000001_42", taken: NOW_S - 3 * 3600 }, { id: "3480000000000000003_42", taken: NOW_S - 1800, video: true }];
const STORY_VIEWS = {}; const STORY_STEP = {};
STORIES.forEach((s, j) => { const pk = s.id.split("_")[0]; STORY_VIEWS[pk] = FOLLOWERS.slice(j * 3, j * 3 + 8 + j * 4).map((u) => u.pk); STORY_STEP[pk] = 0; });
window.storyStep = (pk) => { const v = STORY_VIEWS[pk], k = ++STORY_STEP[pk]; v.unshift(FOLLOWERS[60 + k].pk); const i = 2 + (k % (v.length - 2)); v.unshift(v.splice(i, 1)[0]); };
window.CALLS = [];
const json = (o, st) => Promise.resolve(new Response(JSON.stringify(o), { status: st || 200, headers: { "content-type": "application/json" } }));
window.fetch = (url, opts) => {
  url = String(url); window.CALLS.push((opts && opts.method || "GET") + " " + url.replace("https://www.instagram.com/api/v1", ""));
  const page = (arr) => { const m = url.match(/max_id=(\d+)/); const off = m ? +m[1] : 0; return json({ users: arr.slice(off, off + 100), next_max_id: off + 100 < arr.length ? String(off + 100) : null }); };
  if (/friendships\/42\/following/.test(url)) return page(FOLLOWING);
  if (/friendships\/42\/followers/.test(url)) return page(SERVED_FOLLOWERS);
  if (/show_many/.test(url)) { const ids = decodeURIComponent(opts.body).replace("user_ids=", "").split(","); const r = {}; ids.forEach((id) => r[id] = { followed_by: +id < 1050 }); return json({ friendship_statuses: r }); }
  if (/users\/42\/info/.test(url)) return json({ user: { follower_count: FOLLOWERS.length, following_count: FOLLOWING.length } });
  if (/users\/\d+\/info/.test(url)) return json({ user: { media_count: 0, follower_count: 3, following_count: 2000 } });
  if (/feed\/reels_media/.test(url)) return json({ reels: { "42": { items: STORIES.map((s) => ({ pk: Number(s.id.split("_")[0]), id: s.id, taken_at: s.taken, expiring_at: s.taken + 86400, media_type: s.video ? 2 : 1, image_versions2: { candidates: [] }, viewer_count: STORY_VIEWS[s.id.split("_")[0]].length })) } } });
  { const m = url.match(/media\/(\d+)\/list_reel_media_viewer/); if (m) {
    const v = STORY_VIEWS[m[1]]; if (!v) return json({ message: "Media not found" }, 404);
    const off = (url.match(/max_id=(\d+)/) || [0, 0])[1] | 0;
    if (!off && STORY_STEP[m[1]] >= 0 && window.CALLS.filter((c) => c.includes(m[1])).length > 1) window.storyStep(m[1]);
    const byPk = (pk) => FOLLOWERS.find((u) => u.pk === pk);
    return json({ users: v.slice(off, off + 5).map(byPk), next_max_id: off + 5 < v.length ? String(off + 5) : null, user_count: v.length, total_viewer_count: v.length });
  } }
  if (/feed\/user\/42/.test(url)) return json({ items: POSTS });
  if (/media\/.+\/likers/.test(url)) return json({ users: FOLLOWERS.slice(0, 40).map((u) => ({ pk: u.pk, username: u.username })) });
  if (P.get("dmgone") === "1" && /direct_v2/.test(url)) return Promise.resolve(new Response("<html>Sayfa bulunamadı</html>", { status: 404, headers: { "content-type": "text/html" } }));
  if (/\/api\/graphql/.test(url)) {
    // Instagram'ın 10 Ekim 2026 GraphQL DM yanıt yapısı (tanılama raporundan)
    const bp = new URLSearchParams(String(opts && opts.body || ""));
    const name = bp.get("fb_api_req_friendly_name"); let v = {}; try { v = JSON.parse(bp.get("variables") || "{}"); } catch (e) {}
    const node = (t) => ({ node: { as_ig_direct_thread: { thread_id: t.thread_id, thread_fbid: "1" + t.thread_id.slice(1, 16), folder: "PRIMARY", is_group: false, thread_title: t.users[0].username,
      last_activity_timestamp_ms: String(Math.floor(t.last_activity_at / 1000)), users: t.users.map((u) => ({ id: String(u.pk), pk: String(u.pk), username: u.username, profile_pic_url: "" })) }, __typename: "XIGDirectThreadEdge" }, cursor: "c" });
    const conn = (off, n) => ({ edges: THREADS.slice(off, off + n).map(node), page_info: { end_cursor: "c" + (off + n), has_next_page: off + n < THREADS.length } });
    if (name === "PolarisDirectInboxQuery") return json({ data: { get_slide_mailbox_for_iris_subscription: { id: "123456789012345", threads_by_system_folder_and_ig_inbox_folder: conn(0, 15), threads_by_folder: conn(0, 15), pinned_threads_v2: [] } } });
    if (name === "IGDThreadDetailQuery") {
      const n = Math.min(v.__relay_internal__pv__IGDInitialMessagePageCountrelayprovider || 20, 200);
      const edges = Array.from({ length: Math.min(n, 30) }, (_, i) => ({ node: { message_id: "mid.$test" + i, sender_fbid: i % 2 ? "999" : "111", sender: { igid: i % 2 ? "5" : "42" }, timestamp_ms: String(Date.now() - i * 60000), content_type: "TEXT", text_body: null, content: { text_fragments: [{ plaintext: "test mesajı " + i }] } } }));
      return json({ data: { get_slide_thread_nullable: { as_ig_direct_thread: { viewer: { id: "42", interop_messaging_user_fbid: "111" }, slide_messages: { edges, page_info: { has_previous_page: false, has_next_page: n < 30 } } } } } });
    }
    if (name === "IGDMessageUnsendDialogOffMsysMutation") return json({ data: { direct_unsend_message: true } });
    if (name === "IGDInboxInfoDeleteThreadDialogOffMsysMutation") return json({ data: { ig_direct_hide_thread: { id: v.thread_fbid } } });
    if (/PaginationQuery$/.test(name)) { const off = parseInt(String(v.cursor || "c0").slice(1), 10); return json({ data: { fetch__SlideMailbox: { id: v.id, threads_by_system_folder_and_ig_inbox_folder: conn(off, Math.min(v.count || 5, 20)) } } }); }
    return json({ data: {} });
  }
  if (/direct_v2\/inbox/.test(url)) { const m = url.match(/cursor=(\d+)/); const off = m ? +m[1] : 0; return json({ inbox: { threads: THREADS.slice(off, off + 20), oldest_cursor: String(off + 20), has_older: off + 20 < THREADS.length } }); }
  if (/friendships\/(destroy|create|remove_follower)/.test(url)) return P.get("fail") ? json({ status: "fail", feedback_required: true, feedback_title: "Try Again Later" }, 400) : json({ status: "ok" });
  if (/hide/.test(url)) return json({ status: "ok" });
  return json({}, 404);
};
</script>
<script src="dmcapture.js"></script>
<script>
// Instagram web istemcisinin yeni DM sorgusunu taklit et (tanılama testi için)
// Instagram sayfası açılınca kendi GraphQL isteklerini yapar → uygulama oturum şablonunu öğrenir
_st(() => window.simulateIgInbox(), 0);
window.simulateIgInbox = () => fetch("https://www.instagram.com/api/graphql", { method: "POST", body: new URLSearchParams({ fb_api_req_friendly_name: "PolarisDirectInboxQuery", doc_id: "9876543210123", fb_dtsg: "GIZLI_TOKEN", lsd: "GIZLI_LSD", variables: JSON.stringify({ first: 20, after: null, deviceId: "gizli-cihaz" }) }) });
</script>
<script src="watcher.js"></script>
<script src="inject.js"></script>
